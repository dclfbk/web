<!doctype html>
<html lang="{{ site.lang }}">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/jekyll.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">DCL <span>Digital Commons Lab</span></a>
  <nav aria-label="Main navigation">
    <a href="{{ '/projects/' | relative_url }}">Projects</a>
    <a href="{{ '/maps/' | relative_url }}">Maps &amp; Data</a>
    <a href="{{ '/team/' | relative_url }}">Team</a>
    <a href="{{ '/publications/' | relative_url }}">Publications</a>

  </nav>

<main>{{ content }}</main>
<footer><span>{{ site.title }} · FBK</span><span>Content available under CC BY 4.0</span></footer>

</html>
